## Automation Configuration
```yaml
automation:
  # Workflow schedules
  workflows:
    create_reel_package:
      trigger: "manual"
    publish_reel:
      trigger: "manual"
    daily_snapshot:
      trigger: "scheduled"
      time: "06:00"
    weekly_report:
      trigger: "scheduled"
      day: "Monday"
      time: "07:00"
    hashtag_research:
      trigger: "scheduled"
      day: 1
      time: "09:00"
    comment_triage:
      trigger: "scheduled"
      times: ["09:00", "15:00"]

  # Error handling
  error_handling:
    max_retries: 3
    retry_delay_seconds: 60
    rate_limit_backoff_seconds: 300
    alert_on_failure: true
    alert_channels: ["log"]

  # Logging
  logging:
    level: "INFO"
    audit_log: "automation/logs/audit.log"
    workflow_logs: "automation/logs/workflows/"
    error_log: "automation/logs/errors.log"
```

