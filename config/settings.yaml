# Instagram AI Automation Configuration

## Account Configuration
```yaml
# Primary Instagram Account
primary_account:
  name: "main"                    # Friendly name for MCP
  username: "your_instagram_handle"  # @handle
  user_id: "17841400000000000"       # Instagram User ID (from token exchange)
  tier: "facebook_login"             # instagram_login | facebook_login | unofficial

# Additional Accounts (optional)
additional_accounts: []
```

## MCP Server Configuration
```yaml
mcp:
  command: "instagram-mcp"
  transport: "stdio"
  scope: "user"                     # user | project
  env_vars:
    IG_ACCESS_TOKEN: "YOUR_LONG_LIVED_TOKEN"
    IG_USER_ID: "YOUR_IG_USER_ID"
    IG_HOST: "graph.facebook.com"   # graph.facebook.com | graph.instagram.com
    IG_PREFERRED: "main"            # Preferred account name
    IG_READ_ONLY: "0"               # 1 = disable all write tools
    IG_UNOFFICIAL: "0"              # 1 = enable unofficial tier (NOT RECOMMENDED)
    IG_AUDIT_LOG: "automation/logs/audit.log"
```

## Content Configuration
```yaml
content:
  # Brand voice guidelines
  brand_voice:
    tone: "friendly, expert, encouraging"
    vocabulary_level: "accessible"
    emoji_usage: "moderate (0-3 per post)"
    cta_style: "single, clear, low-pressure"

  # Content pillars (must sum to 100)
  pillars:
    educational: 40
    inspirational: 20
    personal_story: 20
    promotional: 10
    community_ugc: 10

  # Posting schedule preferences
  posting:
    frequency_per_week: 5
    preferred_days: ["Mon", "Tue", "Wed", "Thu", "Fri"]
    preferred_times: ["09:00", "12:00", "17:00"]  # Local timezone
    timezone: "America/New_York"

  # Reel specifications
  reel_specs:
    min_duration_seconds: 3
    max_duration_seconds: 90
    target_duration_seconds: 30
    resolution: "1080x1920"
    aspect_ratio: "9:16"
    max_file_size_mb: 300
    video_codec: "H.264"
    audio_codec: "AAC"
    frame_rate: 30

  # Image specifications
  image_specs:
    format: "JPEG"
    max_file_size_mb: 8
    recommended_resolution: "1080x1080"

  # Carousel specifications
  carousel_specs:
    min_items: 2
    max_items: 20
    image_format: "JPEG"
    video_format: "MP4"
```

## Hashtag Configuration
```yaml
hashtags:
  # Tiered strategy
  tiers:
    niche_specific:
      count: 5-10
      post_count_range: "10K-100K"
      examples: []
    category_industry:
      count: 5-10
      post_count_range: "100K-1M"
      examples: []
    broad_discovery:
      count: 3-5
      post_count_range: "1M+"
      examples: []
    branded:
      count: 1-3
      examples: ["#yourbrand", "#yourseries"]
    trending_seasonal:
      count: 0-3
      examples: []

  # Rotation rules
  rotation:
    min_new_per_post: 5
    max_unique_per_7_days: 30
    never_repeat_exact_set: true

  # Banned hashtag list (update monthly)
  banned_list: []
```

## Publishing Configuration
```yaml
publishing:
  # Safety settings
  safety:
    require_approval_before_publish: true
    require_approval_before_delete: true
    require_approval_before_dm: true
    max_posts_per_day: 10  # Well under 100 limit
    quota_buffer: 20       # Stop at 80/100

  # Staging workflow
  staging:
    use_containers: true
    container_expiry_hours: 24
    auto_publish_on_approval: false  # Manual final step

  # Scheduling (local, not native)
  scheduling:
    enabled: true
    scheduler: "windows_task_scheduler"  # windows_task_scheduler | cron
    max_schedule_ahead_hours: 24  # Container limit
    timezone: "America/New_York"

  # Post types enabled
  enabled_types:
    reels: true
    images: true
    carousels: true
    stories: true
```

## Analytics Configuration
```yaml
analytics:
