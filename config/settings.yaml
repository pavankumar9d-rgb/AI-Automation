## Security Configuration
```yaml
security:
  # Credential management
  credentials:
    use_windows_credential_manager: true
    env_var_prefix: "IG_AUTO_"
    never_log_tokens: true
    token_masking: true

  # Audit
  audit:
    log_all_writes: true
    log_all_reads: false
    retain_audit_days: 365

  # Compliance
  compliance:
    gdpr_aware: true
    coppa_aware: false
    ftc_disclosure_required: true
    disclosure_text: "Ad / Sponsored / Affiliate"
```

---

## Usage Instructions

1. **Copy this file** to `config/settings.yaml`
2. **Fill in your values** (account IDs, tokens, preferences)
3. **Secure the file** - never commit to Git
4. **Reference in workflows** - scripts read from this config

## Environment Variables Alternative

For maximum security, use Windows Credential Manager or environment variables:

```powershell
# Set in Windows Environment Variables (User scope)
IG_AUTO_ACCESS_TOKEN=your_token
IG_AUTO_APP_ID=your_app_id
IG_AUTO_APP_SECRET=your_app_secret
IG_AUTO_USER_ID=your_user_id
```

Then reference in scripts: `$env:IG_AUTO_ACCESS_TOKEN`